name: gateway
# Build + push the gateway image whenever its nginx config changes, so the prod
# gateway can pull a self-contained image instead of bind-mounting host files.
on:
  push:
    branches: [main]
    paths:
      - 'env/gateway/**'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: env/gateway
          push: true
          tags: |
            ghcr.io/pmapacom/gateway:latest
            ghcr.io/pmapacom/gateway:${{ github.sha }}
