# PMapa — full local dev stack (one command brings up the whole backend).
#
#   cp .env.example .env      # a ready dev .env is already committed for convenience
#   docker compose up --build -d
#   docker compose ps         # wait for everything healthy
#
# Request path mirrors production exactly:
#
#     Flutter app ─► gateway (nginx, :8088) ─► auth (verify) ─► inject X-User-Id
#                                            └─► route by domain ─► user / travel / …
#
# Design invariants (kept identical to the cluster):
#   • Only the GATEWAY is the front door for services — auth & user publish NO
#     ports, so they are reachable only through nginx (client identity is never
#     trusted; the gateway strips/injects X-User-Id).
#   • Postgres is EXTERNAL (80.66.64.227): one database AND one login role per
#     service, both named pmapa_<svc> — e.g. travel ⇒ user pmapa_travel in
#     database pmapa_travel (env/db/external/provision.sh creates them and
#     prints the URLs). No pg container and no pgdata volume here, so the data
#     outlives `down -v`.
#   • Redis is EXTERNAL too (managed, db 0) — same instance as prod unless you
#     override REDIS_URL in .env. No redis container, no redisdata volume.
#   • MinIO IS published to localhost here — dev-only, so you can `mc` and
#     inspect state. It binds 127.0.0.1 (not off-box).
#
# Point the Flutter app / contour tests at http://localhost:8088:
#   flutter run --dart-define=CONTOUR_URL=http://localhost:8088
name: pmapa

services:
  # ───────────────────────────── dev mail ─────────────────────────────
  # Mailpit catches all outgoing mail (password resets) so no real SMTP or
  # credentials are needed locally. Inbox UI: http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # ──────────────────────── media object storage ──────────────────────
  # Local MinIO stands in for S3 so photo upload works out of the box.
  # Console: http://localhost:9001 (login minioadmin / minioadmin).
  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15

  # One-shot: creates the media bucket, then exits.
  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MEDIA_S3_BUCKET:-pmapa-media}
      "

  # ───────────────────────────── services ─────────────────────────────
  auth:
    build:
      # Repo root: the Dockerfile copies the local proto module (replace ../proto).
      context: ./auth
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # External database pmapa_auth, user pmapa_auth — see
      # env/db/external/README.md.
      DATABASE_URL: ${AUTH_DATABASE_URL:?set AUTH_DATABASE_URL (run env/db/external/provision.sh)}
      # External Redis — password passed out-of-band, never inside the URL.
      REDIS_URL: ${REDIS_URL:-redis://default@generative-thorough-birthday-92146.db.redis.io:18624/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD (external Redis)}
      AUTH_HTTP_ADDR: ":8080"
      AUTH_SIGNING_KEY_SEED: ${AUTH_SIGNING_KEY_SEED}
      AUTH_ACCESS_TTL: "10m"
      # Password-reset emails go through the notification service (it owns
      # templates + SMTP). Set empty to log tokens instead of emailing.
      AUTH_NOTIFICATION_URL: ${AUTH_NOTIFICATION_URL-http://notification:8080}
      # Account-deletion fan-out: erase the user's data in every domain service.
      AUTH_USER_URL: ${AUTH_USER_URL-http://user:8080}
      AUTH_POST_URL: ${AUTH_POST_URL-http://post:8080}
      AUTH_TRAVEL_URL: ${AUTH_TRAVEL_URL-http://travel:8080}
      AUTH_MESSAGE_URL: ${AUTH_MESSAGE_URL-http://message:8080}
      AUTH_MEDIA_URL: ${AUTH_MEDIA_URL-http://media:8080}
      # Social login (Sign in with Google/Apple): OAuth client id per platform
      # (only client ids are needed, no secrets); all empty ⇒ disabled. The
      # combined *_CLIENT_IDS lists still work and are merged with these.
      AUTH_OIDC_GOOGLE_CLIENT_ID_WEB: ${AUTH_OIDC_GOOGLE_CLIENT_ID_WEB:-}
      AUTH_OIDC_GOOGLE_CLIENT_ID_ANDROID: ${AUTH_OIDC_GOOGLE_CLIENT_ID_ANDROID:-}
      AUTH_OIDC_GOOGLE_CLIENT_ID_IOS: ${AUTH_OIDC_GOOGLE_CLIENT_ID_IOS:-}
      AUTH_OIDC_APPLE_CLIENT_ID_IOS: ${AUTH_OIDC_APPLE_CLIENT_ID_IOS:-}
      AUTH_OIDC_APPLE_CLIENT_ID_WEB: ${AUTH_OIDC_APPLE_CLIENT_ID_WEB:-}
      AUTH_OIDC_GOOGLE_CLIENT_IDS: ${AUTH_OIDC_GOOGLE_CLIENT_IDS:-}
      AUTH_OIDC_APPLE_CLIENT_IDS: ${AUTH_OIDC_APPLE_CLIENT_IDS:-}
    depends_on:
      notification:
        condition: service_started
      user:
        condition: service_started
    # No published ports — reachable only via the gateway.

  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${USER_DATABASE_URL:?set USER_DATABASE_URL (run env/db/external/provision.sh)}
      USER_HTTP_ADDR: ":8080"
      USER_STATS_URL: ${USER_STATS_URL-http://stats:8080}
      USER_NOTIFICATION_URL: ${USER_NOTIFICATION_URL-http://notification:8080}
      # Comma-separated moderator user ids (empty = no admins). Set to your dev
      # user id to unlock the in-app Moderation queue.
      USER_ADMIN_IDS: ${USER_ADMIN_IDS:-}
    depends_on:
      stats:
        condition: service_started
      notification:
        condition: service_started
    # No published ports — reachable only via the gateway.

  travel:
    build:
      context: ./travel
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${TRAVEL_DATABASE_URL:?set TRAVEL_DATABASE_URL (run env/db/external/provision.sh)}
      TRAVEL_HTTP_ADDR: ":8080"
      TRAVEL_STATS_URL: ${TRAVEL_STATS_URL-http://stats:8080}
    depends_on:
      stats:
        condition: service_started
    # No published ports — reachable only via the gateway.

  post:
    build:
      context: ./post
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${POST_DATABASE_URL:?set POST_DATABASE_URL (run env/db/external/provision.sh)}
      POST_HTTP_ADDR: ":8080"
      POST_USER_URL: "http://user:8080"   # feed followees, in-cluster
      POST_STATS_URL: ${POST_STATS_URL-http://stats:8080}
      POST_NOTIFICATION_URL: ${POST_NOTIFICATION_URL-http://notification:8080}
    depends_on:
      user:
        condition: service_started
      stats:
        condition: service_started
      notification:
        condition: service_started
    # No published ports — reachable only via the gateway.

  store:
    build:
      context: ./store
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${STORE_DATABASE_URL:?set STORE_DATABASE_URL (run env/db/external/provision.sh)}
      STORE_HTTP_ADDR: ":8080"
      STORE_STATS_URL: ${STORE_STATS_URL-http://stats:8080}
    depends_on:
      stats:
        condition: service_started
    # No published ports — reachable only via the gateway.

  stay:
    build:
      context: ./stay
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${STAY_DATABASE_URL:?set STAY_DATABASE_URL (run env/db/external/provision.sh)}
      STAY_HTTP_ADDR: ":8080"
      STAY_STATS_URL: ${STAY_STATS_URL-http://stats:8080}
    depends_on:
      stats:
        condition: service_started
    # No published ports — reachable only via the gateway.

  message:
    build:
      context: ./message
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${MESSAGE_DATABASE_URL:?set MESSAGE_DATABASE_URL (run env/db/external/provision.sh)}
      MESSAGE_HTTP_ADDR: ":8080"
      # Fire-and-forget "message.new" events; empty ⇒ disabled.
      MESSAGE_NOTIFICATION_URL: ${MESSAGE_NOTIFICATION_URL-http://notification:8080}
      MESSAGE_STATS_URL: ${MESSAGE_STATS_URL-http://stats:8080}
      MESSAGE_USER_URL: ${MESSAGE_USER_URL-http://user:8080}   # DM block gate
    depends_on:
      notification:
        condition: service_started
      stats:
        condition: service_started
      user:
        condition: service_started
    # No published ports — reachable only via the gateway.

  media:
    build:
      context: ./media
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${MEDIA_DATABASE_URL:?set MEDIA_DATABASE_URL (run env/db/external/provision.sh)}
      MEDIA_HTTP_ADDR: ":8080"
      # S3-compatible object storage — defaults to the local MinIO container.
      # Override MEDIA_S3_* in .env to point at a real provider; set
      # MEDIA_S3_ENDPOINT= (empty) to fall back to Postgres blobs.
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT-http://minio:9000}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-pmapa-media}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-minioadmin}
      MEDIA_S3_PREFIX: ${MEDIA_S3_PREFIX:-media/}
      MEDIA_S3_PATH_STYLE: ${MEDIA_S3_PATH_STYLE:-true}
      # Empty locally: MinIO is not a public origin, so reads are proxied by the
      # media service. Set it (to a Cloudflare custom domain on the R2 bucket)
      # to serve reads from the CDN instead — see .env.example.
      MEDIA_S3_PUBLIC_BASE_URL: ${MEDIA_S3_PUBLIC_BASE_URL-}
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # No published ports — reachable only via the gateway.

  # ─────────────────────────── notification ───────────────────────────
  # INTERNAL-ONLY: owns email templates + SMTP delivery. Called s2s (auth →
  # password resets); no gateway route, no published port. Mail lands in the
  # local Mailpit by default — point NOTIFICATION_SMTP_* at a real relay in
  # .env, or set NOTIFICATION_SMTP_HOST= (empty) to log emails instead.
  notification:
    build:
      context: ./notification
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NOTIFICATION_HTTP_ADDR: ":8080"
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST-mailpit}
      NOTIFICATION_SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-1025}
      NOTIFICATION_SMTP_USERNAME: ${NOTIFICATION_SMTP_USERNAME:-}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-}
      NOTIFICATION_SMTP_FROM: ${NOTIFICATION_SMTP_FROM:-PMapa <no-reply@pmapa.app>}
      NOTIFICATION_RESET_URL_BASE: ${NOTIFICATION_RESET_URL_BASE:-}
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?set NOTIFICATION_DATABASE_URL (run env/db/external/provision.sh)}
    depends_on:
      mailpit:
        condition: service_started

  # ───────────────────────── telegrambot (ops) ─────────────────────────
  # Ops bot: polls every service's /readyz, /internal/logz and /internal/stats,
  # alerts to Telegram on a down service or new WARN+ logs, and posts an
  # aggregated status+stats report on a timer. Off by default — enable with
  # `docker compose --profile ops up` after setting TELEGRAM_BOT_TOKEN/CHAT_ID.
  telegrambot:
    build:
      context: ./telegrambot
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["ops"]
    environment:
      TELEGRAM_HTTP_ADDR: ":8080"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_POLL_INTERVAL: ${TELEGRAM_POLL_INTERVAL:-30s}
      TELEGRAM_REPORT_INTERVAL: ${TELEGRAM_REPORT_INTERVAL:-24h}
      TELEGRAM_ALERT_COOLDOWN: ${TELEGRAM_ALERT_COOLDOWN:-5m}
      TELEGRAM_SERVICES: >-
        auth=http://auth:8080,user=http://user:8080,travel=http://travel:8080,
        post=http://post:8080,message=http://message:8080,store=http://store:8080,
        media=http://media:8080,notification=http://notification:8080,stats=http://stats:8080,
        geo=http://geo:8080,stay=http://stay:8080

  # ────────────────────────────── stats ───────────────────────────────
  # INTERNAL-ONLY metrics store: services push named metrics (Set/Inc) and
  # read them back (Get/BatchGet); values live in the EXTERNAL Redis under
  # `metric:*`. No gateway route, no published port.
  stats:
    build:
      context: ./stats
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://default@generative-thorough-birthday-92146.db.redis.io:18624/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD (external Redis)}
      STATS_HTTP_ADDR: ":8080"

  # ──────────────────────────────── geo ───────────────────────────────
  # PUBLIC place dictionary: the ISO 3166-1 country list (embedded in the
  # binary) + the GeoNames cities500 tier (~236k places, baked into the image
  # from geo/data). Pure reference data — no database, no volume, no seed job.
  # Routed through the gateway WITHOUT auth so /explore works signed-out.
  geo:
    build:
      context: ./geo
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GEO_HTTP_ADDR: ":8080"
      GEO_CITIES_PATH: "/data/cities500.txt"
    # No published ports — reachable only via the gateway.

  # ─────────────────────────────── web app ────────────────────────────
  # Flutter web bundle served as static files. Opt-in (profile "web") so the
  # default `docker compose up` stays lean; the gateway's `location /` routes to
  # `app:8080`. Bring it up with: docker compose --profile web up -d
  #   Build context is the repo root (app/ needs proto/gen/dart alongside it).
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        # Local web build talks to the local gateway (same origin as :8088).
        PMAPA_API_URL: http://localhost:${GATEWAY_PORT:-8088}
    restart: unless-stopped
    profiles: ["web"]
    # No published ports — reachable only via the gateway.

  # ───────────────────────────── gateway ──────────────────────────────
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./env/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./env/gateway/snippets:/etc/nginx/gateway/snippets:ro
    ports:
      - "${GATEWAY_PORT:-8088}:8080"
    depends_on:
      - auth
      - user
      - travel
      - geo

volumes:
  # No *-pgdata and no *-redisdata: Postgres and Redis are both external now
  # (env/db/external), so their data outlives `docker compose down -v`.
  minio-data:
