# Data tier for the stats service — the STATEFUL instance.
#
# The stats service is a generic named-metric store; every value lives in this
# ONE logical Redis (single source of truth), while the service itself runs as N
# stateless replicas elsewhere and connects here via REDIS_URL. In the cloud this
# maps to managed Redis. No Postgres — stats keeps nothing relational.
#
# All config comes from the environment (.env) — no secrets baked into the image.
name: pmapa-stats-data

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Exposed to the container so the healthcheck below can authenticate.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Password-protected + AOF persistence: the metrics should survive a restart.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    # Default host port 6380 so it coexists with the auth data tier's Redis (6379).
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redisdata:
