# PMapa internal cluster gateway (HTTP).
#
# TLS termination, real-IP hiding and geo/anycast edge are a SEPARATE outer
# layer in front of this — not handled here. This gateway authenticates every
# request (nginx auth_request → auth /internal/verify), injects a trusted
# X-User-Id, and routes to the domain services.
#
# Security invariants:
#   * a client-supplied X-User-Id is NEVER trusted — it is overwritten (empty on
#     public routes, the verified id on authenticated ones);
#   * the original method + URI are forwarded to /internal/verify so auth can
#     check the DPoP htu/htm binding;
#   * back-end services must be reachable ONLY through this gateway.

worker_processes auto;
events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  # Docker embedded DNS so upstreams re-resolve at runtime (N replicas).
  resolver 127.0.0.11 ipv6=off valid=10s;

  # Client-facing scheme/host: trust the edge's X-Forwarded-* when present,
  # otherwise use our own (direct/test contour). The edge must strip any
  # client-supplied X-Forwarded-* before us.
  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }
  # $http_host (not $host) — keeps the port, which the client includes in the
  # DPoP htu. Mismatch here breaks DPoP verification.
  map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ""      $http_host;
  }

  # Proto package domain → upstream host. Add a line per domain service; the
  # $domain capture comes from the routing location's regex. Unknown → "" → 404.
  map $domain $domain_upstream {
    default "";
    user    "user:8080";
    post    "post:8080";
    travel  "travel:8080";
    message "message:8080";
    store   "store:8080";
    media   "media:8080";
  }

  # Dev CORS: reflect a localhost browser origin (Flutter web dev server),
  # empty for everything else. Empty for native/mobile (no Origin) and for any
  # non-localhost origin → no CORS headers in production. See snippets/cors.conf.
  map $http_origin $cors_origin {
    default                        "";
    "~^https?://localhost:\d+$"    $http_origin;
    "~^https?://127\.0\.0\.1:\d+$" $http_origin;
  }
  # Gate the companion CORS headers on an allowed origin too, so a request with
  # no/other Origin gets ZERO CORS headers (nginx omits an add_header whose value
  # is the empty string) — the production/native path stays byte-for-byte clean.
  map $cors_origin $cors_cred {
    ""      "";
    default "true";
  }
  map $cors_origin $cors_expose {
    ""      "";
    default "Content-Type, Connect-Protocol-Version, DPoP-Nonce";
  }

  # Rate-limit auth-sensitive endpoints (per client IP).
  limit_req_zone $binary_remote_addr zone=auth_sensitive:10m rate=5r/s;
  limit_req_status 429;

  server {
    listen 8080;
    server_name _;

    # Upstream as a variable so proxy_pass defers DNS to the resolver.
    set $auth_upstream "auth:8080";

    # ---- Internal auth verification (never exposed directly) ----
    location = /_verify {
      internal;
      proxy_pass http://$auth_upstream/internal/verify;
      proxy_pass_request_body off;               # verify reads headers, not body
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-Method $request_method;  # DPoP htm
      proxy_set_header X-Original-URI $request_uri;        # DPoP htu
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-Host $fwd_host;
      # Authorization + DPoP headers ride along from the original request.
    }

    # ---- Public auth RPCs (no gateway auth) ----
    location ~ ^/pmapa\.auth\.v1\.AuthService/(Register|Login|LoginWithOidc|Refresh|Logout|RequestPasswordReset|ResetPassword|WhoAmI)$ {
      include /etc/nginx/gateway/snippets/cors.conf;
      limit_req zone=auth_sensitive burst=10 nodelay;
      proxy_set_header X-User-Id "";             # strip any spoofed identity
      include /etc/nginx/gateway/snippets/proxy_common.conf;
      proxy_pass http://$auth_upstream;
    }

    # ---- Authenticated auth RPCs (device management) ----
    location ~ ^/pmapa\.auth\.v1\.AuthService/(ListSessions|RevokeSession|DeleteAccount|ChangePassword)$ {
      include /etc/nginx/gateway/snippets/cors.conf;
      auth_request /_verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      proxy_set_header X-User-Id $user_id;       # only from the verify response
      include /etc/nginx/gateway/snippets/proxy_common.conf;
      proxy_pass http://$auth_upstream;
    }

    # ---- Domain services (user / travel / post / …) — ALL authenticated. ----
    # The chat's server-stream: same verify/inject as the generic block, but
    # with buffering OFF and a long read timeout so pushed messages reach the
    # client immediately and the idle stream isn't cut. Defined BEFORE the
    # generic block (exact-prefix regex wins by order).
    location ~ ^/pmapa\.message\.v\d+\.MessageService/Subscribe$ {
      include /etc/nginx/gateway/snippets/cors.conf;
      auth_request /_verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      proxy_set_header X-User-Id $user_id;
      include /etc/nginx/gateway/snippets/proxy_common.conf;
      # buffering-off + 1h read timeout now come from proxy_common (needed by
      # every Connect stream), so no per-location override here.
      proxy_pass http://message:8080;
    }

    # ---- Stats is now a fully INTERNAL service (pmapa.api.stats, unversioned):
    # every RPC is s2s-only and never routed here, so /pmapa.api.stats.* falls
    # through to 404 for external clients. No stats location.

    # ---- Notifications: END-USER read surface for the in-app activity feed.
    # Only the listed RPCs are routed (authenticated). The internal write path
    # moved to pmapa.api.email (SendEmail) + pmapa.api.notify (Notify) — separate
    # unversioned s2s contracts with no gateway route (404 from outside), so a
    # client can't inject events or send mail.
    location ~ ^/pmapa\.notification\.v\d+\.NotificationService/(ListNotifications|MarkNotificationsRead|RegisterDevice|UnregisterDevice|GetNotificationPrefs|UpdateNotificationPrefs)$ {
      include /etc/nginx/gateway/snippets/cors.conf;
      auth_request /_verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      proxy_set_header X-User-Id $user_id;
      include /etc/nginx/gateway/snippets/proxy_common.conf;
      proxy_pass http://notification:8080;
    }

    # Media uploads carry raw image bytes (up to 5 MiB), so this one domain needs
    # its body cap raised above nginx's 1 MiB default. Scoped here — every other
    # RPC keeps the small default. Placed before the generic block so it wins.
    location ~ ^/pmapa\.media\.v\d+\. {
      include /etc/nginx/gateway/snippets/cors.conf;
      auth_request /_verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      proxy_set_header X-User-Id $user_id;
      include /etc/nginx/gateway/snippets/proxy_common.conf;
      client_max_body_size 8m;
      proxy_pass http://media:8080;
    }

    # One generic block: verify via auth, inject the verified X-User-Id, and
    # route by proto-package domain. Regex is restricted to known domains so an
    # unknown one falls through to 404 (fail-closed). Defined AFTER the auth
    # blocks so auth RPCs match their own locations first.
    location ~ ^/pmapa\.(?<domain>user|travel|post|message|store)\.v\d+\. {
      include /etc/nginx/gateway/snippets/cors.conf;
      auth_request /_verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      proxy_set_header X-User-Id $user_id;   # only from the verify response
      include /etc/nginx/gateway/snippets/proxy_common.conf;
      proxy_pass http://$domain_upstream;
    }

    # Public image bytes — unguessable ids, no auth (Image.network sends none).
    location ^~ /media/ {
      include /etc/nginx/gateway/snippets/proxy_common.conf;
      proxy_pass http://media:8080;
    }

    # Public key set so clients/services can verify access tokens independently.
    location = /.well-known/jwks.json {
      include /etc/nginx/gateway/snippets/proxy_common.conf;
      proxy_pass http://$auth_upstream;
    }

    location = /healthz { return 200 "ok\n"; }
  }
}
