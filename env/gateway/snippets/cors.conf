# Dev-only CORS for the Flutter WEB client (Connect-RPC over fetch/XHR).
#
# Safe for production: $cors_origin (see the map in nginx.conf) is EMPTY for any
# non-localhost origin and for requests with no Origin header at all — so native
# and mobile clients, and real edge traffic, get no CORS headers and behave
# exactly as before. Only a browser served from http(s)://localhost:<port> gets
# its origin reflected.
#
# The OPTIONS preflight is answered here in the rewrite phase, BEFORE auth_request
# runs — a preflight carries no Authorization/DPoP, so it must not be verified.
if ($request_method = OPTIONS) {
  add_header Access-Control-Allow-Origin      $cors_origin always;
  add_header Access-Control-Allow-Methods     "POST, GET, OPTIONS" always;
  add_header Access-Control-Allow-Headers     "Content-Type, Connect-Protocol-Version, Connect-Timeout-Ms, Authorization, DPoP" always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Max-Age           "86400" always;
  add_header Content-Length                   "0";
  return 204;
}
add_header Access-Control-Allow-Origin      $cors_origin always;
add_header Access-Control-Allow-Credentials $cors_cred   always;
add_header Access-Control-Expose-Headers    $cors_expose always;
