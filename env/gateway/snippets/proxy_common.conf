# Shared proxy settings for every upstream. Connect-RPC is plain HTTP (not gRPC
# framing), so proxy_pass — with buffering off so server-streams flow.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Client-facing scheme/host (set by the edge; falls back to ours when direct).
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Forwarded-Host $fwd_host;
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
