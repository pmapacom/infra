# Cloud app tier for the auth service — stateless, scale to N replicas.
#
# Pulls a pre-built image and reads all config from .env. State lives in the
# managed Postgres + Redis pointed at by DATABASE_URL / REDIS_URL (see env/db/auth
# for the local data tier). No published port — reachable only via the gateway.
#
#   docker network create pmapa   # once per host (see ../README.md)
#   cp .env.example .env && $EDITOR .env
#   docker compose pull && docker compose up -d
name: pmapa-auth

services:
  auth:
    image: ${IMAGE:-ghcr.io/pmapa/auth:latest}
    restart: unless-stopped
    environment:
      # ── data tier (managed Postgres + Redis) ──
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed Postgres}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL to the managed Redis}
      AUTH_HTTP_ADDR: ":8080"
      # ── secrets ──
      AUTH_SIGNING_KEY_SEED: ${AUTH_SIGNING_KEY_SEED:?set a base64 32-byte seed}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-10m}
      # ── in-cluster service URLs (resolved on the shared pmapa network) ──
      AUTH_NOTIFICATION_URL: ${AUTH_NOTIFICATION_URL-http://notification:8080}
      AUTH_USER_URL: ${AUTH_USER_URL-http://user:8080}
      AUTH_POST_URL: ${AUTH_POST_URL-http://post:8080}
      AUTH_TRAVEL_URL: ${AUTH_TRAVEL_URL-http://travel:8080}
      AUTH_MESSAGE_URL: ${AUTH_MESSAGE_URL-http://message:8080}
      AUTH_MEDIA_URL: ${AUTH_MEDIA_URL-http://media:8080}
      # ── social login (comma-separated OIDC client ids; empty = disabled) ──
      AUTH_OIDC_GOOGLE_CLIENT_IDS: ${AUTH_OIDC_GOOGLE_CLIENT_IDS:-}
      AUTH_OIDC_APPLE_CLIENT_IDS: ${AUTH_OIDC_APPLE_CLIENT_IDS:-}

# All services share one external network so they resolve each other by name.
networks:
  default:
    name: pmapa
    external: true
