# Cloud app tier for the auth service — stateless, scale to N replicas.
#
# Defaults are baked in below (image, listen addr, TTLs, in-cluster URLs). You
# only fill the secrets/connection strings in .env. To change the image tag or an
# in-cluster default, edit THIS file — not the environment.
#
#   docker network create pmapa   # once per host (see ../README.md)
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
name: pmapa-auth

services:
  auth:
    image: ghcr.io/pmapa/auth:latest
    restart: unless-stopped
    environment:
      # ── fill these by hand in .env ──
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed Postgres}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL to the managed Redis}
      AUTH_SIGNING_KEY_SEED: ${AUTH_SIGNING_KEY_SEED:?set a base64 32-byte seed}
      # Optional — social login accepted OIDC client ids; unset ⇒ disabled.
      AUTH_OIDC_GOOGLE_CLIENT_IDS: ${AUTH_OIDC_GOOGLE_CLIENT_IDS-}
      AUTH_OIDC_APPLE_CLIENT_IDS: ${AUTH_OIDC_APPLE_CLIENT_IDS-}
      # ── baked defaults (edit here to change) ──
      AUTH_HTTP_ADDR: ":8080"
      AUTH_ACCESS_TTL: "10m"
      AUTH_NOTIFICATION_URL: "http://notification:8080"
      AUTH_USER_URL: "http://user:8080"
      AUTH_POST_URL: "http://post:8080"
      AUTH_TRAVEL_URL: "http://travel:8080"
      AUTH_MESSAGE_URL: "http://message:8080"
      AUTH_MEDIA_URL: "http://media:8080"

# All services share one external network so they resolve each other by name.
networks:
  default:
    name: pmapa
    external: true
