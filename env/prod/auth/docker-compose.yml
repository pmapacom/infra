# Cloud app tier for the auth service — stateless, scale to N replicas.
#
# Defaults are baked in below (image, listen addr, TTLs, in-cluster URLs). You
# only fill the secrets/connection strings in .env. To change the image tag or an
# in-cluster default, edit THIS file — not the environment.
#
#   docker network create pmapa   # once per host (see ../README.md)
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
name: pmapa-auth

services:
  auth:
    image: ghcr.io/pmapacom/auth:latest
    restart: unless-stopped
    networks: [pmapa, auth-data]   # pmapa: reach other services · auth-data: reach auth-postgres/redis
    environment:
      # ── fill these by hand in .env ──
      # Passwords are passed OUT-OF-BAND (PGPASSWORD / REDIS_PASSWORD), never in the
      # URL — so any characters are safe (no URL-encoding needed). host/db/user are
      # baked; they must equal AUTH_POSTGRES_PASSWORD / AUTH_REDIS_PASSWORD in
      # env/prod/infra/.env. Extracting a DB later: edit the host + sslmode below.
      DATABASE_URL: postgres://auth@auth-postgres:5432/auth?sslmode=disable
      PGPASSWORD: ${AUTH_POSTGRES_PASSWORD:?set AUTH_POSTGRES_PASSWORD (match infra)}
      REDIS_URL: redis://auth-redis:6379/0
      REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:?set AUTH_REDIS_PASSWORD (match infra)}
      AUTH_SIGNING_KEY_SEED: ${AUTH_SIGNING_KEY_SEED:?set a base64 32-byte seed}
      # Social login OAuth client ids (one per platform); all unset ⇒ disabled.
      # Only client ids are needed — no secrets, no key files. A Google client
      # id is public by design: it is the `aud` of the ID token and is visible
      # in any page or app binary that uses it, so these are defaults here
      # rather than stack secrets. The service MERGES every value below, so a
      # token is accepted whichever platform minted it — adding one never
      # invalidates another. Override any of them from the stack environment.
      #
      # Project pmapa-507107 (console.cloud.google.com → Clients):
      #   web      → the pmapa.com site (JS origin https://pmapa.com)
      #   android  → the Play build
      #   ios      → the App Store build
      AUTH_OIDC_GOOGLE_CLIENT_ID_WEB: ${AUTH_OIDC_GOOGLE_CLIENT_ID_WEB-509452346817-obblrgvasch8ngk2006a6i1h5okmutmg.apps.googleusercontent.com}
      AUTH_OIDC_GOOGLE_CLIENT_ID_ANDROID: ${AUTH_OIDC_GOOGLE_CLIENT_ID_ANDROID-509452346817-hoa8ou0qp2titamopnupp88m15j7kmk0.apps.googleusercontent.com}
      AUTH_OIDC_GOOGLE_CLIENT_ID_IOS: ${AUTH_OIDC_GOOGLE_CLIENT_ID_IOS-509452346817-naoojh6bu7khg8rui1epjchjp067ktk7.apps.googleusercontent.com}
      AUTH_OIDC_APPLE_CLIENT_ID_IOS: ${AUTH_OIDC_APPLE_CLIENT_ID_IOS-}
      AUTH_OIDC_APPLE_CLIENT_ID_WEB: ${AUTH_OIDC_APPLE_CLIENT_ID_WEB-}
      # Anything extra, comma-separated — e.g. the localhost web client used
      # for local development (origin http://localhost:8080).
      AUTH_OIDC_GOOGLE_CLIENT_IDS: ${AUTH_OIDC_GOOGLE_CLIENT_IDS-509452346817-13k4thi73iu7dhu59ts861abseldfvkc.apps.googleusercontent.com}
      AUTH_OIDC_APPLE_CLIENT_IDS: ${AUTH_OIDC_APPLE_CLIENT_IDS-}
      # ── baked defaults (edit here to change) ──
      AUTH_HTTP_ADDR: ":8080"
      AUTH_ACCESS_TTL: "10m"
      AUTH_NOTIFICATION_URL: "http://notification:8080"
      AUTH_USER_URL: "http://user:8080"
      AUTH_POST_URL: "http://post:8080"
      AUTH_TRAVEL_URL: "http://travel:8080"
      AUTH_MESSAGE_URL: "http://message:8080"
      AUTH_MEDIA_URL: "http://media:8080"

# pmapa: shared app-tier network (services resolve each other by name).
# auth-data: this service's isolated data network (owned by env/prod/infra).
networks:
  pmapa:
    external: true
  auth-data:
    external: true
