# Cloud front door — the ONLY published service. Terminate TLS at an outer edge
# (LB / Cloudflare) in front of this; the gateway itself speaks plain HTTP on the
# published port and authenticates every request (auth_request → auth), then
# routes by proto domain to the back-ends over the shared pmapa network.
#
# The nginx config is BAKED INTO the image (built from env/gateway by the infra
# CI) — no host bind mounts, which are fragile under Portainer git stacks. To
# change the config: edit env/gateway/* and push; CI rebuilds the image, then
# redeploy this stack. No .env — to change the public port, edit the mapping below.
#
#   docker compose pull && docker compose up -d
name: pmapa-gateway

services:
  gateway:
    image: ghcr.io/pmapacom/gateway:latest
    restart: unless-stopped
    ports:
      # Public HTTP port (behind your TLS edge) : container listens on :8080.
      - "80:8080"

networks:
  default:
    name: pmapa
    external: true
