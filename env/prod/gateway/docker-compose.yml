# Cloud front door — the ONLY published service. Terminate TLS at an outer edge
# (LB / Cloudflare) in front of this; the gateway itself speaks plain HTTP on the
# published port and authenticates every request (auth_request → auth), then
# routes by proto domain to the back-ends over the shared pmapa network.
#
# Mounts the same nginx config used everywhere else (env/gateway/*), so the
# request path is identical to local + the test contour. No .env — nothing here
# is a secret; to change the public port, edit the ports mapping below.
#
#   docker compose up -d
name: pmapa-gateway

services:
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../gateway/snippets:/etc/nginx/gateway/snippets:ro
    ports:
      # Public HTTP port (behind your TLS edge) : container listens on :8080.
      - "80:8080"

networks:
  default:
    name: pmapa
    external: true
