# Cloud app tier for the media service — stateless, scale to N replicas.
# Everything about the Cloudflare R2 bucket that is not a credential is a
# LITERAL below (account endpoint, bucket `s3-1`, region, prefix, addressing) —
# nothing to pass at deploy time. Only the three ${...:?} vars are supplied at
# deploy time; the compose refuses to start if any of them is missing.
# No published port — public /media/{id} bytes are served via the gateway.
name: pmapa-media

services:
  media:
    image: ghcr.io/pmapacom/media:latest
    restart: unless-stopped
    networks: [pmapa, media-data]   # media-data carries media-postgres
    environment:
      # ── supplied at deploy time (secrets) ──
      # host/db/user are baked (known from env/prod/infra); the secrets are the
      # Postgres password (must equal MEDIA_POSTGRES_PASSWORD in
      # env/prod/infra) and the Cloudflare R2 token credentials.
      DATABASE_URL: postgres://media@media-postgres:5432/media?sslmode=disable
      PGPASSWORD: ${MEDIA_POSTGRES_PASSWORD:?set MEDIA_POSTGRES_PASSWORD (match infra)}
      # R2 API token scoped to the bucket with Object Read & Write
      # (Cloudflare dashboard → R2 → Manage API Tokens) — not an account key.
      MEDIA_S3_ACCESS_KEY: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}
      MEDIA_S3_SECRET_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}
      # ── fixed values — change them HERE, never at deploy time ──
      MEDIA_HTTP_ADDR: ":8080"
      # Cloudflare R2 (S3-compatible), bucket `s3-1` (ENAM). The endpoint is
      # ACCOUNT-scoped — the bucket name is not part of it, even though the
      # dashboard displays the S3 API as <endpoint>/s3-1. With path-style
      # addressing the bucket is added to the path by the client, so pasting
      # the dashboard URL verbatim would write every object under s3-1/s3-1/.
      MEDIA_S3_ENDPOINT: "https://df058166f94b385da0fae8106c5b9f00.r2.cloudflarestorage.com"
      MEDIA_S3_BUCKET: "s3-1"
      # R2 is single-region (the ENAM location hint is not an S3 region) and
      # expects the literal "auto" in the SigV4 scope.
      MEDIA_S3_REGION: "auto"
      MEDIA_S3_PREFIX: "media/"
      # R2 addresses buckets path-style on the r2.cloudflarestorage.com
      # endpoint; virtual-hosted bucket hosts are not served there.
      MEDIA_S3_PATH_STYLE: "true"
      # Cloudflare CDN in front of the bucket, for READS only: the custom
      # domain cdn1.pmapa.com, bound to this bucket under R2 → s3-1 → Settings →
      # Custom Domains. Uploads still go through this service; GET /media/{id}
      # redirects to the edge, which maps the URL path 1:1 onto the object key,
      # so this must line up with the prefix above: /media/<id> → key media/<id>.
      # Deliberately NOT the apex pmapa.com — an R2 custom domain takes over the
      # whole hostname, and that hostname belongs to the gateway and the front.
      MEDIA_S3_PUBLIC_BASE_URL: "https://cdn1.pmapa.com"

networks:
  pmapa:
    external: true
  media-data:
    external: true
