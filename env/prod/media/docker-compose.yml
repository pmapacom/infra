# Cloud app tier for the media service — stateless, scale to N replicas.
# Defaults baked in below; fill the DB + S3 connection details in .env.
# No published port — public /media/{id} bytes are served via the gateway.
name: pmapa-media

services:
  media:
    image: ghcr.io/pmapacom/media:latest
    restart: unless-stopped
    networks: [pmapa, media-data]   # media-data also carries MinIO
    environment:
      # ── fill by hand in .env ──
      # Only the passwords are secrets; host/db/user + the on-box MinIO endpoint
      # are baked (known from env/prod/infra). Passwords must equal
      # MEDIA_POSTGRES_PASSWORD / MINIO_ROOT_PASSWORD in env/prod/infra/.env.
      DATABASE_URL: postgres://media@media-postgres:5432/media?sslmode=disable
      PGPASSWORD: ${MEDIA_POSTGRES_PASSWORD:?set MEDIA_POSTGRES_PASSWORD (match infra)}
      MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-pmapa}
      MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD (match infra)}
      # ── baked defaults (edit here to change) ──
      MEDIA_HTTP_ADDR: ":8080"
      # On-box MinIO. Set MEDIA_S3_ENDPOINT empty here to store bytes as Postgres blobs.
      MEDIA_S3_ENDPOINT: "http://minio:9000"
      MEDIA_S3_REGION: "us-east-1"
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-pmapa-media}
      MEDIA_S3_PREFIX: "media/"
      # true for MinIO (the on-box store) / most providers; set false for AWS
      # virtual-hosted buckets when you move off MinIO.
      MEDIA_S3_PATH_STYLE: "true"

networks:
  pmapa:
    external: true
  media-data:
    external: true
