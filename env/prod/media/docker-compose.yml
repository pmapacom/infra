# Cloud app tier for the media service — stateless, scale to N replicas.
# Defaults baked in below; fill the DB + S3 connection details in .env.
# No published port — public /media/{id} bytes are served via the gateway.
name: pmapa-media

services:
  media:
    image: ghcr.io/pmapa/media:latest
    restart: unless-stopped
    networks: [pmapa, media-data]   # media-data also carries MinIO
    environment:
      # ── fill by hand in .env ──
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed Postgres}
      # S3-compatible storage. Leave MEDIA_S3_ENDPOINT empty to store bytes as
      # Postgres blobs instead (then the other S3_* values are ignored).
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT?set MEDIA_S3_ENDPOINT (empty for Postgres blobs)}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION-us-east-1}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET-}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY-}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY-}
      # ── baked defaults (edit here to change) ──
      MEDIA_HTTP_ADDR: ":8080"
      MEDIA_S3_PREFIX: "media/"
      # true for MinIO (the on-box store) / most providers; set false for AWS
      # virtual-hosted buckets when you move off MinIO.
      MEDIA_S3_PATH_STYLE: "true"

networks:
  pmapa:
    external: true
  media-data:
    external: true
