# Cloud app tier for the message service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
name: pmapa-message

services:
  message:
    image: ghcr.io/pmapa/message:latest
    restart: unless-stopped
    networks: [pmapa, message-data]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; host/db/user are baked (known from
      # env/prod/infra). Must equal MESSAGE_POSTGRES_PASSWORD in env/prod/infra/.env.
      DATABASE_URL: postgres://message:${MESSAGE_POSTGRES_PASSWORD:?set MESSAGE_POSTGRES_PASSWORD (match infra)}@message-postgres:5432/message?sslmode=disable
      # ── baked defaults (edit here to change) ──
      MESSAGE_HTTP_ADDR: ":8080"
      MESSAGE_USER_URL: "http://user:8080"
      MESSAGE_NOTIFICATION_URL: "http://notification:8080"
      MESSAGE_STATS_URL: "http://stats:8080"

networks:
  pmapa:
    external: true
  message-data:
    external: true
