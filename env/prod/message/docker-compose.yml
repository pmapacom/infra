# Cloud app tier for the message service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
name: pmapa-message

services:
  message:
    image: ghcr.io/pmapa/message:latest
    restart: unless-stopped
    networks: [pmapa, message-data]
    environment:
      # ── fill by hand in .env ──
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed Postgres}
      # ── baked defaults (edit here to change) ──
      MESSAGE_HTTP_ADDR: ":8080"
      MESSAGE_USER_URL: "http://user:8080"
      MESSAGE_NOTIFICATION_URL: "http://notification:8080"
      MESSAGE_STATS_URL: "http://stats:8080"

networks:
  pmapa:
    external: true
  message-data:
    external: true
