# Cloud app tier for the message service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
name: pmapa-message

services:
  message:
    image: ghcr.io/pmapacom/message:latest
    restart: unless-stopped
    networks: [pmapa]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; the database is EXTERNAL — database
      # pmapa_message on 80.66.64.227, shared login role pmapa_user
      # (env/db/external). pg_trgm is pre-installed there by provision.sh.
      DATABASE_URL: postgres://pmapa_user@80.66.64.227:5432/pmapa_message?sslmode=require
      PGPASSWORD: ${PMAPA_DB_PASSWORD:?set PMAPA_DB_PASSWORD (shared role pmapa_user)}
      # ── baked defaults (edit here to change) ──
      MESSAGE_HTTP_ADDR: ":8080"
      MESSAGE_USER_URL: "http://user:8080"
      MESSAGE_NOTIFICATION_URL: "http://notification:8080"
      MESSAGE_STATS_URL: "http://stats:8080"

# pmapa: shared app-tier network (peers by name) and the route out to the
# external Postgres. No <svc>-data network — this service has no on-box store.
networks:
  pmapa:
    external: true
