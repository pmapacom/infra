# Cloud app tier for the notification service — stateless, scale to N replicas.
# Defaults baked in below; fill the DB + SMTP details in .env. No published port.
# Uses NOTIFICATION_DATABASE_URL (not the shared DATABASE_URL).
name: pmapa-notification

services:
  notification:
    image: ghcr.io/pmapa/notification:latest
    restart: unless-stopped
    environment:
      # ── fill by hand in .env ──
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?set the managed Postgres URL}
      # SMTP relay. Leave NOTIFICATION_SMTP_HOST empty to log emails instead of sending.
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST?set the SMTP host (empty to log)}
      NOTIFICATION_SMTP_USERNAME: ${NOTIFICATION_SMTP_USERNAME-}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD-}
      NOTIFICATION_RESET_URL_BASE: ${NOTIFICATION_RESET_URL_BASE-}
      # ── baked defaults (edit here to change) ──
      NOTIFICATION_HTTP_ADDR: ":8080"
      NOTIFICATION_SMTP_PORT: "587"
      NOTIFICATION_SMTP_FROM: "PMapa <no-reply@pmapa.app>"

networks:
  default:
    name: pmapa
    external: true
