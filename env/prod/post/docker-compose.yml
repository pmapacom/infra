# Cloud app tier for the post service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
name: pmapa-post

services:
  post:
    image: ghcr.io/pmapa/post:latest
    restart: unless-stopped
    networks: [pmapa, post-data]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; host/db/user are baked (known from
      # env/prod/infra). Must equal POST_POSTGRES_PASSWORD in env/prod/infra/.env.
      DATABASE_URL: postgres://post:${POST_POSTGRES_PASSWORD:?set POST_POSTGRES_PASSWORD (match infra)}@post-postgres:5432/post?sslmode=disable
      # ── baked defaults (edit here to change) ──
      POST_HTTP_ADDR: ":8080"
      POST_USER_URL: "http://user:8080"
      POST_STATS_URL: "http://stats:8080"
      POST_NOTIFICATION_URL: "http://notification:8080"

networks:
  pmapa:
    external: true
  post-data:
    external: true
