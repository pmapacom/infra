# Cloud app tier for the post service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
name: pmapa-post

services:
  post:
    image: ghcr.io/pmapacom/post:latest
    restart: unless-stopped
    networks: [pmapa]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; the database is EXTERNAL — database
      # pmapa_post on 80.66.64.227, shared login role pmapa_user (env/db/external).
      DATABASE_URL: postgres://pmapa_user@80.66.64.227:5432/pmapa_post?sslmode=require
      PGPASSWORD: ${POST_POSTGRES_PASSWORD:?set POST_POSTGRES_PASSWORD (shared role pmapa_user)}
      # ── baked defaults (edit here to change) ──
      POST_HTTP_ADDR: ":8080"
      POST_USER_URL: "http://user:8080"
      POST_STATS_URL: "http://stats:8080"
      POST_NOTIFICATION_URL: "http://notification:8080"

# pmapa: shared app-tier network (peers by name) and the route out to the
# external Postgres. No <svc>-data network — this service has no on-box store.
networks:
  pmapa:
    external: true
