# Cloud app tier for the post service — stateless, scale to N replicas.
# State lives in managed Postgres (DATABASE_URL). No published port — via gateway.
name: pmapa-post

services:
  post:
    image: ${IMAGE:-ghcr.io/pmapa/post:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed Postgres}
      POST_HTTP_ADDR: ":8080"
      POST_USER_URL: ${POST_USER_URL-http://user:8080}
      POST_STATS_URL: ${POST_STATS_URL-http://stats:8080}
      POST_NOTIFICATION_URL: ${POST_NOTIFICATION_URL-http://notification:8080}

networks:
  default:
    name: pmapa
    external: true
