# Cloud app tier for the stats service — stateless, scale to N replicas.
# Defaults baked in below; fill only STATS_REDIS_PASSWORD in .env.
# INTERNAL-only, no published port.
name: pmapa-stats

services:
  stats:
    image: ghcr.io/pmapacom/stats:latest
    restart: unless-stopped
    networks: [pmapa]
    environment:
      # ── fill by hand in .env ──
      # Redis is EXTERNAL (managed): host/user/db are baked below, only the
      # password is a secret and it is passed OUT-OF-BAND (REDIS_PASSWORD),
      # never inside the URL — so any characters are safe (no URL-encoding).
      # One shared instance with auth is safe: stats keys are all `metric:*`,
      # auth's are `deny:*`/`dpop:*`/`fail:*`, and neither service ever runs
      # FLUSHDB or an unscoped KEYS/SCAN.
      REDIS_URL: redis://default@generative-thorough-birthday-92146.db.redis.io:18624/0
      REDIS_PASSWORD: ${STATS_REDIS_PASSWORD:?set STATS_REDIS_PASSWORD (external Redis)}
      # ── baked defaults (edit here to change) ──
      STATS_HTTP_ADDR: ":8080"

networks:
  pmapa:
    external: true
