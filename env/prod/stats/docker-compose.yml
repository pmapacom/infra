# Cloud app tier for the stats service — stateless, scale to N replicas.
# Defaults baked in below; fill only REDIS_URL in .env. INTERNAL-only, no port.
name: pmapa-stats

services:
  stats:
    image: ghcr.io/pmapacom/stats:latest
    restart: unless-stopped
    networks: [pmapa, stats-data]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; host is baked (known from env/prod/infra).
      # Must equal STATS_REDIS_PASSWORD in env/prod/infra/.env.
      REDIS_URL: redis://stats-redis:6379/0
      REDIS_PASSWORD: ${STATS_REDIS_PASSWORD:?set STATS_REDIS_PASSWORD (match infra)}
      # ── baked defaults (edit here to change) ──
      STATS_HTTP_ADDR: ":8080"

networks:
  pmapa:
    external: true
  stats-data:
    external: true
