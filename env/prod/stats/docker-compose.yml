# Cloud app tier for the stats service — stateless, scale to N replicas.
# Defaults baked in below; fill only REDIS_URL in .env. INTERNAL-only, no port.
name: pmapa-stats

services:
  stats:
    image: ghcr.io/pmapa/stats:latest
    restart: unless-stopped
    environment:
      # ── fill by hand in .env ──
      REDIS_URL: ${REDIS_URL:?set REDIS_URL to the managed Redis}
      # ── baked defaults (edit here to change) ──
      STATS_HTTP_ADDR: ":8080"

networks:
  default:
    name: pmapa
    external: true
