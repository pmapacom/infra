# Cloud app tier for the stay service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
name: pmapa-stay

services:
  stay:
    image: ghcr.io/pmapacom/stay:latest
    restart: unless-stopped
    networks: [pmapa]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; the database is EXTERNAL — database
      # pmapa_stay on 80.66.64.227, login role pmapa_stay (env/db/external).
      # btree_gist is pre-installed there by provision.sh.
      DATABASE_URL: postgres://pmapa_stay@80.66.64.227:5432/pmapa_stay?sslmode=require
      PGPASSWORD: ${STAY_POSTGRES_PASSWORD:?set STAY_POSTGRES_PASSWORD (role pmapa_stay)}
      # ── baked defaults (edit here to change) ──
      STAY_HTTP_ADDR: ":8080"
      STAY_STATS_URL: "http://stats:8080"

# pmapa: shared app-tier network (peers by name) and the route out to the
# external Postgres. No <svc>-data network — this service has no on-box store.
networks:
  pmapa:
    external: true
