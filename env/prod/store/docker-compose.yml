# Cloud app tier for the store service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
name: pmapa-store

services:
  store:
    image: ghcr.io/pmapacom/store:latest
    restart: unless-stopped
    networks: [pmapa, store-data]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; host/db/user are baked (known from
      # env/prod/infra). Must equal STORE_POSTGRES_PASSWORD in env/prod/infra/.env.
      DATABASE_URL: postgres://store@store-postgres:5432/store?sslmode=disable
      PGPASSWORD: ${STORE_POSTGRES_PASSWORD:?set STORE_POSTGRES_PASSWORD (match infra)}
      # ── baked defaults (edit here to change) ──
      STORE_HTTP_ADDR: ":8080"
      STORE_STATS_URL: "http://stats:8080"

networks:
  pmapa:
    external: true
  store-data:
    external: true
