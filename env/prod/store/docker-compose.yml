# Cloud app tier for the store service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
name: pmapa-store

services:
  store:
    image: ghcr.io/pmapa/store:latest
    restart: unless-stopped
    networks: [pmapa, store-data]
    environment:
      # ── fill by hand in .env ──
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed Postgres}
      # ── baked defaults (edit here to change) ──
      STORE_HTTP_ADDR: ":8080"
      STORE_STATS_URL: "http://stats:8080"

networks:
  pmapa:
    external: true
  store-data:
    external: true
