# Cloud ops bot — polls every service's /readyz, /internal/logz, /internal/stats
# and alerts/report to Telegram. Deploy ONE instance (no shared state). Defaults
# baked in below; fill only the bot token + chat id in .env.
name: pmapa-telegrambot

services:
  telegrambot:
    image: ghcr.io/pmapacom/telegrambot:latest
    restart: unless-stopped
    environment:
      # ── fill by hand in .env ──
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set the Telegram bot token}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set the Telegram chat id}
      # Optional: reach the Bot API through a reverse proxy (a Cloudflare Worker)
      # when api.telegram.org is blocked from your host. Empty ⇒ talk to Telegram
      # directly. See cloudflare-worker.js + README in this folder.
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE-}
      # ── baked defaults (edit here to change) ──
      TELEGRAM_HTTP_ADDR: ":8080"
      TELEGRAM_POLL_INTERVAL: "30s"
      TELEGRAM_REPORT_INTERVAL: "24h"
      TELEGRAM_ALERT_COOLDOWN: "5m"
      TELEGRAM_SERVICES: "auth=http://auth:8080,user=http://user:8080,travel=http://travel:8080,post=http://post:8080,message=http://message:8080,store=http://store:8080,media=http://media:8080,notification=http://notification:8080,stats=http://stats:8080"

networks:
  default:
    name: pmapa
    external: true
