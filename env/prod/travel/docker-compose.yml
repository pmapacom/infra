# Cloud app tier for the travel service — stateless, scale to N replicas.
# State lives in managed Postgres (DATABASE_URL). No published port — via gateway.
name: pmapa-travel

services:
  travel:
    image: ${IMAGE:-ghcr.io/pmapa/travel:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the managed Postgres}
      TRAVEL_HTTP_ADDR: ":8080"
      TRAVEL_STATS_URL: ${TRAVEL_STATS_URL-http://stats:8080}

networks:
  default:
    name: pmapa
    external: true
