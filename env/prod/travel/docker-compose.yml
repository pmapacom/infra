# Cloud app tier for the travel service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
name: pmapa-travel

services:
  travel:
    image: ghcr.io/pmapacom/travel:latest
    restart: unless-stopped
    networks: [pmapa]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; the database is EXTERNAL — database
      # pmapa_travel on 80.66.64.227, login role pmapa_travel (env/db/external).
      DATABASE_URL: postgres://pmapa_travel@80.66.64.227:5432/pmapa_travel?sslmode=require
      PGPASSWORD: ${TRAVEL_POSTGRES_PASSWORD:?set TRAVEL_POSTGRES_PASSWORD (role pmapa_travel)}
      # ── baked defaults (edit here to change) ──
      TRAVEL_HTTP_ADDR: ":8080"
      TRAVEL_STATS_URL: "http://stats:8080"

# pmapa: shared app-tier network (peers by name) and the route out to the
# external Postgres. No <svc>-data network — this service has no on-box store.
networks:
  pmapa:
    external: true
