# Cloud app tier for the travel service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
name: pmapa-travel

services:
  travel:
    image: ghcr.io/pmapa/travel:latest
    restart: unless-stopped
    networks: [pmapa, travel-data]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; host/db/user are baked (known from
      # env/prod/infra). Must equal TRAVEL_POSTGRES_PASSWORD in env/prod/infra/.env.
      DATABASE_URL: postgres://travel:${TRAVEL_POSTGRES_PASSWORD:?set TRAVEL_POSTGRES_PASSWORD (match infra)}@travel-postgres:5432/travel?sslmode=disable
      # ── baked defaults (edit here to change) ──
      TRAVEL_HTTP_ADDR: ":8080"
      TRAVEL_STATS_URL: "http://stats:8080"

networks:
  pmapa:
    external: true
  travel-data:
    external: true
