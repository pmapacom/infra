# Cloud app tier for the user service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
name: pmapa-user

services:
  user:
    image: ghcr.io/pmapacom/user:latest
    restart: unless-stopped
    networks: [pmapa, user-data]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; host/db/user are baked (known from
      # env/prod/infra). Must equal USER_POSTGRES_PASSWORD in env/prod/infra/.env.
      DATABASE_URL: postgres://user:${USER_POSTGRES_PASSWORD:?set USER_POSTGRES_PASSWORD (match infra)}@user-postgres:5432/user?sslmode=disable
      # Optional — comma-separated moderator user ids (unlocks the Moderation queue).
      USER_ADMIN_IDS: ${USER_ADMIN_IDS-}
      # ── baked defaults (edit here to change) ──
      USER_HTTP_ADDR: ":8080"
      USER_STATS_URL: "http://stats:8080"
      USER_NOTIFICATION_URL: "http://notification:8080"

networks:
  pmapa:
    external: true
  user-data:
    external: true
