# Cloud app tier for the user service — stateless, scale to N replicas.
# Defaults baked in below; fill only DATABASE_URL in .env. No published port.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
name: pmapa-user

services:
  user:
    image: ghcr.io/pmapacom/user:latest
    restart: unless-stopped
    networks: [pmapa]
    environment:
      # ── fill by hand in .env ──
      # Only the password is a secret; the database is EXTERNAL — database
      # pmapa_user on 80.66.64.227, login role pmapa_user (env/db/external).
      DATABASE_URL: postgres://pmapa_user@80.66.64.227:5432/pmapa_user?sslmode=require
      PGPASSWORD: ${USER_POSTGRES_PASSWORD:?set USER_POSTGRES_PASSWORD (role pmapa_user)}
      # Optional — comma-separated moderator user ids (unlocks the Moderation queue).
      USER_ADMIN_IDS: ${USER_ADMIN_IDS-}
      # ── baked defaults (edit here to change) ──
      USER_HTTP_ADDR: ":8080"
      USER_STATS_URL: "http://stats:8080"
      USER_NOTIFICATION_URL: "http://notification:8080"

# pmapa: shared app-tier network (peers by name) and the route out to the
# external Postgres. No <svc>-data network — this service has no on-box store.
networks:
  pmapa:
    external: true
