# Self-contained TEST CONTOUR for the auth service: gateway + auth + data on one
# private network. Only the gateway is published — the auth service and the data
# tier are unreachable from the host, enforcing "back-ends only via the gateway".
#
#   docker compose up --build -d
name: pmapa-auth-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 15

  auth:
    build:
      # Build context is the repo root so the Dockerfile can copy the local
      # proto module (auth/go.mod: replace ../proto/gen/go).
      context: ../../..
      dockerfile: auth/Dockerfile
    environment:
      DATABASE_URL: "postgres://auth:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      AUTH_HTTP_ADDR: ":8080"
      AUTH_SIGNING_KEY_SEED: ${AUTH_SIGNING_KEY_SEED}
      AUTH_ACCESS_TTL: "10m"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No published ports — reachable only via the gateway.

  gateway:
    image: nginx:alpine
    volumes:
      - ../../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../gateway/snippets:/etc/nginx/gateway/snippets:ro
    ports:
      - "${GATEWAY_PORT:-8088}:8080"
    depends_on:
      - auth
