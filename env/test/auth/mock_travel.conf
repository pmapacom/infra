# Mock domain service for the test contour. Stands in for a real `travel`
# Connect service: echoes the X-User-Id the gateway injected, so we can prove
# domain routing + auth_request injection reach a domain upstream.
events {}
http {
  server {
    listen 8080;
    location / {
      default_type text/plain;
      return 200 "travel-mock user=$http_x_user_id\n";
    }
  }
}
